apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: {{ .Values.orderService.namespace }}

spec:
  replicas: {{ .Values.orderService.replicaCount }}

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
      - name: order-service

        image: "{{ .Values.orderService.image.repository }}:{{ .Values.orderService.image.tag }}"

        ports:
        - containerPort: {{ .Values.orderService.containerPort }}

        env:

        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: order-config
              key: DB_HOST

        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: order-config
              key: DB_NAME

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: order-secret
              key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: order-secret
              key: DB_PASSWORD

        - name: USER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: order-config
              key: USER_SERVICE_URL
